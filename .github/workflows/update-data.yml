# ------------------------------------------------------------------
# Runs the data collector every day and saves the results in the repo.
# Because GitHub Pages serves this repo, saving new data = updating the site.
# ------------------------------------------------------------------
name: Update data daily

on:
  schedule:
    # 22:13 UTC = 5:13 PM New York (winter) — after the US market closes.
    # "1-5" means Monday to Friday — weekends have no new stock prices.
    - cron: "13 22 * * 1-5"
    # A lighter morning run so news, events and crypto stay fresh.
    - cron: "27 11 * * *"
  # Adds a "Run workflow" button in the Actions tab.
  workflow_dispatch:

permissions:
  contents: write # lets the job commit the new data files

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect today's data
        run: node scripts/fetch-data.mjs

      - name: Save the new data
        run: |
          git config user.name "pulse-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Daily data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
